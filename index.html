<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>date eba</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #fff0f2;
        --muted: #e3a1aa;
        --paper: #1a070a;
        --rose: #e53b56;
        --rose-deep: #9f1029;
        --blood: #6d0618;
        --night: #090406;
        --gold: #f0c775;
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.48);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 18%, rgba(229, 59, 86, 0.34), transparent 28%),
          radial-gradient(circle at 82% 12%, rgba(240, 199, 117, 0.14), transparent 24%),
          linear-gradient(135deg, #090406 0%, #21070d 52%, #5b0616 100%);
        display: grid;
        place-items: center;
        padding: 28px;
        overflow-x: hidden;
      }

      .invite {
        position: relative;
        width: min(100%, 760px);
        min-height: min(760px, calc(100vh - 56px));
        overflow: hidden;
        border: 1px solid rgba(240, 199, 117, 0.28);
        border-radius: 24px;
        background:
          linear-gradient(145deg, rgba(22, 5, 8, 0.96), rgba(66, 7, 20, 0.9)),
          repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 15px);
        background-position: center;
        background-size: cover;
        box-shadow: var(--shadow);
        isolation: isolate;
      }

      .invite::before {
        content: "";
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(240, 199, 117, 0.2);
        border-radius: 18px;
        pointer-events: none;
      }

      .invite::after {
        content: "";
        position: absolute;
        inset: auto -18% -30% 35%;
        height: 280px;
        border-radius: 999px;
        background: rgba(229, 59, 86, 0.18);
        filter: blur(42px);
        pointer-events: none;
      }

      .bat-cloud {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .bat {
        position: absolute;
        width: var(--bat-size, 36px);
        height: var(--bat-size, 36px);
        opacity: var(--bat-opacity, 0.2);
        transform: rotate(var(--bat-rotate, 0deg));
        background: rgba(255, 226, 210, 0.74);
        filter: drop-shadow(0 0 12px rgba(229, 59, 86, 0.18));
        mask: url("assets/bat-icon.svg") center / contain no-repeat;
        -webkit-mask: url("assets/bat-icon.svg") center / contain no-repeat;
      }

      .bat-one {
        top: 12%;
        right: 15%;
        --bat-size: 42px;
        --bat-opacity: 0.16;
        --bat-rotate: -8deg;
      }

      .bat-two {
        top: 15%;
        left: 9%;
        --bat-size: 22px;
        --bat-opacity: 0.14;
        --bat-rotate: 12deg;
      }

      .bat-three {
        right: 8%;
        top: 43%;
        --bat-size: 28px;
        --bat-opacity: 0.11;
        --bat-rotate: 14deg;
      }

      .bat-four {
        left: 13%;
        bottom: 34%;
        --bat-size: 32px;
        --bat-opacity: 0.1;
        --bat-rotate: -12deg;
      }

      .bat-five {
        right: 35%;
        top: 30%;
        --bat-size: 18px;
        --bat-opacity: 0.09;
        --bat-rotate: 6deg;
      }

      .bat-six {
        right: 18%;
        bottom: 18%;
        --bat-size: 24px;
        --bat-opacity: 0.1;
        --bat-rotate: -14deg;
      }

      .bat-seven {
        left: 35%;
        bottom: 12%;
        --bat-size: 20px;
        --bat-opacity: 0.08;
        --bat-rotate: 10deg;
      }

      .bat-eight {
        left: 6%;
        top: 52%;
        --bat-size: 24px;
        --bat-opacity: 0.08;
        --bat-rotate: -4deg;
      }

      .bat-nine {
        right: 7%;
        bottom: 39%;
        --bat-size: 18px;
        --bat-opacity: 0.09;
        --bat-rotate: 18deg;
      }

      .bat-ten {
        left: 26%;
        top: 7%;
        --bat-size: 16px;
        --bat-opacity: 0.1;
        --bat-rotate: -16deg;
      }

      .bat-eleven {
        right: 48%;
        bottom: 27%;
        --bat-size: 22px;
        --bat-opacity: 0.08;
        --bat-rotate: -3deg;
      }

      .bat-twelve {
        left: 6%;
        bottom: 15%;
        --bat-size: 18px;
        --bat-opacity: 0.08;
        --bat-rotate: 9deg;
      }

      .bat-thirteen {
        top: 8%;
        right: 26%;
        --bat-size: 20px;
        --bat-opacity: 0.11;
        --bat-rotate: 16deg;
      }

      .bat-fourteen {
        top: 21%;
        right: 20%;
        --bat-size: 18px;
        --bat-opacity: 0.1;
        --bat-rotate: -18deg;
      }

      .bat-fifteen {
        top: 25%;
        right: 8%;
        --bat-size: 24px;
        --bat-opacity: 0.09;
        --bat-rotate: 9deg;
      }

      .bat-sixteen {
        top: 6%;
        left: 43%;
        --bat-size: 15px;
        --bat-opacity: 0.09;
        --bat-rotate: -10deg;
      }

      .bat-seventeen {
        top: 18%;
        left: 33%;
        --bat-size: 17px;
        --bat-opacity: 0.08;
        --bat-rotate: 7deg;
      }

      .content {
        position: relative;
        z-index: 1;
        min-height: inherit;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 28px;
        padding: clamp(28px, 7vw, 64px);
      }

      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        color: var(--muted);
        font-size: clamp(0.78rem, 2vw, 0.92rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .topline:empty {
        display: none;
      }

      .seal {
        display: grid;
        place-items: center;
        width: 54px;
        aspect-ratio: 1;
        border: 1px solid rgba(240, 199, 117, 0.34);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--gold);
        font-family: Georgia, serif;
        font-size: 1.7rem;
        line-height: 1;
      }

      main {
        align-self: center;
        max-width: none;
      }

      .hero-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(145px, 28vw, 215px);
        gap: clamp(18px, 4vw, 34px);
        align-items: center;
      }

      .copy-block {
        max-width: 540px;
        min-width: 0;
      }

      h1 {
        margin: 0;
        max-width: 8.8ch;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.1rem, 7.5vw, 5.7rem);
        line-height: 0.92;
        font-weight: 700;
        color: var(--ink);
        text-shadow: 0 0 22px rgba(229, 59, 86, 0.35);
        overflow-wrap: break-word;
      }

      .lead {
        margin: 26px 0 0;
        max-width: 40rem;
        color: #f7cdd2;
        font-size: clamp(1.08rem, 2.6vw, 1.38rem);
        line-height: 1.55;
      }

      .portrait-row {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        margin-top: 30px;
      }

      .vampire-card {
        position: relative;
        margin: 0;
        padding: 8px;
        border: 1px solid rgba(240, 199, 117, 0.32);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
        transform: rotate(2deg);
      }

      .leon-card {
        width: 100%;
      }

      .vampire-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 8px;
        object-fit: cover;
      }

      .vampire-card figcaption {
        margin-top: 8px;
        color: var(--gold);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 34px 0 0;
      }

      .detail {
        min-height: 92px;
        padding: 16px;
        border: 1px solid rgba(240, 199, 117, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
      }

      .label {
        display: block;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .value {
        display: block;
        margin-top: 9px;
        color: #fff7f0;
        font-size: clamp(0.98rem, 2.2vw, 1.12rem);
        line-height: 1.2;
        font-weight: 760;
      }

      .answer-row {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 30px;
        min-height: 64px;
      }

      button,
      .tiny-note {
        font: inherit;
      }

      .yes {
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        padding: 0 22px;
        background: linear-gradient(135deg, var(--rose), var(--blood));
        color: #fff;
        box-shadow: 0 12px 24px rgba(229, 59, 86, 0.28);
        cursor: pointer;
        font-weight: 800;
        transform-origin: center;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          padding 180ms ease;
      }

      .yes.is-glowing {
        padding-inline: 30px;
        transform: scale(1.05);
        box-shadow:
          0 16px 30px rgba(173, 63, 98, 0.28),
          0 0 0 7px rgba(229, 59, 86, 0.15);
      }

      .maybe {
        min-height: 48px;
        border: 1px solid rgba(240, 199, 117, 0.22);
        border-radius: 999px;
        padding: 0 18px;
        background: rgba(255, 255, 255, 0.09);
        color: var(--ink);
        cursor: pointer;
        font-weight: 750;
        position: relative;
        z-index: 2;
        transform: translate(var(--run-x, 0), var(--run-y, 0)) rotate(var(--run-r, 0));
        transition:
          transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
          background 180ms ease,
          color 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
        touch-action: manipulation;
        white-space: nowrap;
        text-align: center;
      }

      .maybe.is-running {
        border-color: rgba(240, 199, 117, 0.34);
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 12px 22px rgba(0, 0, 0, 0.26);
      }

      .maybe.is-surrendered {
        border-color: transparent;
        background: var(--rose);
        color: #fff;
        transform: translate(0, 0) rotate(-2deg);
      }

      .yes:focus-visible,
      .maybe:focus-visible {
        outline: 3px solid rgba(123, 168, 140, 0.55);
        outline-offset: 3px;
      }

      .tiny-note {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 100%;
        margin: 12px 0 0;
        min-height: 24px;
        color: #ff9aaa;
        font-weight: 800;
        line-height: 1.35;
      }

      footer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 20px;
        align-items: center;
        color: #f0c8ce;
        font-size: clamp(0.88rem, 2vw, 0.98rem);
        line-height: 1.45;
      }

      .refusal-line {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        font-weight: 850;
      }

      .footer-mark {
        display: inline-flex;
        align-items: center;
        color: var(--gold);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.8rem, 5vw, 3rem);
        line-height: 1;
      }

      .footer-stickers {
        display: flex;
        align-items: end;
        gap: 12px;
      }

      .sidekick-sticker {
        width: clamp(50px, 8vw, 66px);
        aspect-ratio: 1;
        border: 1px solid rgba(240, 199, 117, 0.32);
        border-radius: 12px;
        object-fit: cover;
        transform: rotate(-6deg);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
      }

      .ghost-sticker {
        width: clamp(54px, 9vw, 76px);
        aspect-ratio: 1;
        border: 1px solid rgba(240, 199, 117, 0.28);
        border-radius: 12px;
        object-fit: cover;
        transform: rotate(5deg) translateY(-6px);
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.3);
      }

      @media (max-width: 680px) {
        body {
          display: block;
          padding: 10px;
        }

        .invite {
          width: 100%;
          min-height: calc(100svh - 20px);
          border-radius: 18px;
        }

        .invite::before {
          inset: 12px;
          border-radius: 13px;
        }

        .content {
          min-height: calc(100svh - 20px);
          gap: 20px;
          padding: 24px 22px;
        }

        .topline {
          align-items: start;
        }

        main {
          align-self: start;
          max-width: none;
        }

        .hero-layout {
          grid-template-columns: 1fr;
        }

        .portrait-row {
          justify-content: center;
          margin-top: 18px;
        }

        .leon-card {
          width: min(62vw, 220px);
        }

        h1 {
          max-width: 11ch;
          font-size: clamp(3rem, 17vw, 4.7rem);
          line-height: 0.92;
        }

        .lead {
          margin-top: 18px;
          font-size: 1.04rem;
          line-height: 1.45;
        }

        .details {
          grid-template-columns: 1fr;
          gap: 9px;
          margin-top: 24px;
        }

        .detail {
          min-height: auto;
          padding: 13px 14px;
        }

        .answer-row {
          display: grid;
          grid-template-columns: 1fr;
          align-items: stretch;
          gap: 10px;
          margin-top: 22px;
          min-height: 126px;
        }

        .yes,
        .maybe {
          width: 100%;
          min-height: 50px;
          padding-inline: 16px;
        }

        .maybe {
          max-width: 100%;
          white-space: normal;
        }

        .tiny-note {
          align-items: center;
          min-height: 40px;
          margin-top: 6px;
          font-size: 0.95rem;
        }

        footer {
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: end;
          gap: 12px;
        }

        .refusal-line {
          align-items: center;
          max-width: calc(100% - 82px);
        }

        .footer-mark {
          grid-column: 2;
          grid-row: 1;
          margin-left: auto;
        }

        .footer-stickers {
          grid-column: 1 / -1;
          grid-row: 2;
          justify-content: flex-end;
          gap: 10px;
          margin-top: -4px;
        }

        .sidekick-sticker {
          width: 52px;
          border-radius: 10px;
        }

        .ghost-sticker {
          width: 58px;
        }

        .bat-one {
          right: 8%;
          top: 20%;
        }

        .bat-six,
        .bat-seven,
        .bat-eight,
        .bat-eleven,
        .bat-twelve,
        .bat-sixteen,
        .bat-seventeen {
          display: none;
        }
      }

      @media (max-width: 420px) {
        body {
          padding: 6px;
        }

        .invite {
          min-height: calc(100svh - 12px);
          border-radius: 14px;
        }

        .invite::before {
          inset: 8px;
          border-radius: 10px;
        }

        .content {
          min-height: calc(100svh - 12px);
          padding: 20px 18px;
        }

        h1 {
          font-size: clamp(2.55rem, 16vw, 3.65rem);
        }

        .lead {
          font-size: 0.98rem;
        }

        .value {
          font-size: 0.98rem;
        }

        .refusal-line {
          max-width: 100%;
        }

        .leon-card {
          width: min(64vw, 190px);
        }

        .sidekick-sticker {
          width: 48px;
        }

        .ghost-sticker {
          width: 52px;
        }

        .bat-one {
          --bat-size: 30px;
        }

        .bat-two,
        .bat-five,
        .bat-nine,
        .bat-ten,
        .bat-thirteen,
        .bat-fourteen,
        .bat-fifteen {
          --bat-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <article class="invite" aria-label="Convite para um date">
      <div class="bat-cloud" aria-hidden="true">
        <span class="bat bat-one"></span>
        <span class="bat bat-two"></span>
        <span class="bat bat-three"></span>
        <span class="bat bat-four"></span>
        <span class="bat bat-five"></span>
        <span class="bat bat-six"></span>
        <span class="bat bat-seven"></span>
        <span class="bat bat-eight"></span>
        <span class="bat bat-nine"></span>
        <span class="bat bat-ten"></span>
        <span class="bat bat-eleven"></span>
        <span class="bat bat-twelve"></span>
        <span class="bat bat-thirteen"></span>
        <span class="bat bat-fourteen"></span>
        <span class="bat bat-fifteen"></span>
        <span class="bat bat-sixteen"></span>
        <span class="bat bat-seventeen"></span>
      </div>
      <div class="content">
        <header class="topline">
         
          <span class="seal" aria-hidden="true">♥</span>
        </header>

        <main>
          <div class="hero-layout">
            <div class="copy-block">
              <h1>Oiii vamos sair amanhã?</h1>
              <p class="lead">
                E se a gente sair pra se conhecer melhor e conversarmos bem muito sobre tudo que a gente gosta em um lugar bacana? 
              </p>
            </div>
            <div class="portrait-row" aria-label="Imagens do convite">
              <figure class="vampire-card leon-card">
                <img src="assets/vampire-date.png" alt="Imagem romântica em estilo vampiro" />
              </figure>
            </div>
          </div>

          <section class="details" aria-label="Detalhes do convite">
            <div class="detail">
              <span class="label">Quando</span>
              <span class="value">Sábado, 16h</span>
            </div>
            <div class="detail">
              <span class="label">Onde</span>
              <span class="value">Kataluma Café</span>
            </div>
            <div class="detail">
              <span class="label">Tem que levar</span>
              <span class="value">Sua presença</span>
            </div>
          </section>

          <div class="answer-row">
            <button class="yes" type="button">Simm, vamos😊</button>
            <button class="maybe" type="button" aria-describedby="decline-note">Não vou conseguir😔</button>
          </div>
          <p class="tiny-note" id="decline-note" aria-live="polite">
            <span class="note-text"></span>
          </p>
        </main>

        <footer>
          <span class="refusal-line">
            
          </span>
          <span class="footer-stickers" aria-hidden="true">
            <img
              class="sidekick-sticker"
              src="assets/vampire-sidekick.png"
              alt=""
            />
            <img
              class="ghost-sticker"
              src="assets/ghostface-phone.png"
              alt=""
            />
          </span>
          <span class="footer-mark" aria-hidden="true">♥</span>
        </footer>
      </div>
    </article>

    <script>
      const yes = document.querySelector(".yes");
      const maybe = document.querySelector(".maybe");
      const note = document.querySelector(".tiny-note");
      const noteText = document.querySelector(".note-text");
      const formEndpoint = "https://formspree.io/f/mojgpvoy";
      const escapeMoves = [
        { x: 42, y: -18, r: "3deg", text: "Não tem como recusar.." },
        { x: -34, y: 22, r: "-4deg", text: "Já falei que não tem como🙄" },
        { x: 58, y: 26, r: "5deg", text: "Melhor apertar o sim logo.." },
        { x: 0, y: 0, r: "-2deg", text: "Simm, a gente vai" },
      ];
      let declineAttempts = 0;
      let acceptedSent = false;
      let declineSent = false;

      async function notifyAcceptance() {
        if (acceptedSent) {
          return true;
        }

        try {
          const response = await fetch(formEndpoint, {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              resposta: "aceitou",
              convite: "date",
              quando: "Sábado, 16h",
              onde: "Kataluma Café",
              mensagem: "Ela clicou em Simm, vamos",
            }),
          });

          acceptedSent = response.ok;
          return response.ok;
        } catch {
          return false;
        }
      }

      async function notifyFirstDecline() {
        if (declineSent) {
          return;
        }

        declineSent = true;

        try {
          await fetch(formEndpoint, {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              resposta: "tentou recusar",
              convite: "date",
              quando: "Sábado, 16h",
              onde: "Kataluma Café",
              tentativa: 1,
              mensagem: "Ela clicou em Não vou conseguir",
            }),
          });
        } catch {
          declineSent = false;
        }
      }

      yes.addEventListener("click", async () => {
        noteText.textContent = "ebaa, a gente se encontra lá e come bastante😋. avisando aqui...";
        yes.classList.add("is-glowing");
        maybe.classList.remove("is-running");

        const notified = await notifyAcceptance();
        noteText.textContent = notified
          ? "ebaa, a gente se encontra lá e come bastante😋."
          : "ebaa, a gente se encontra lá e come bastante😋.";
      });

      function updateDeclineGame() {
        const index = Math.min(declineAttempts, escapeMoves.length) - 1;
        const move = escapeMoves[Math.max(index, 0)];
        const runScale = window.matchMedia("(max-width: 520px)").matches ? 0.45 : 1;

        maybe.classList.add("is-running");
        maybe.style.setProperty("--run-x", `${Math.round(move.x * runScale)}px`);
        maybe.style.setProperty("--run-y", `${Math.round(move.y * runScale)}px`);
        maybe.style.setProperty("--run-r", move.r);
        maybe.textContent = move.text;
        noteText.textContent = "E não pode recusar";

        if (declineAttempts >= 4) {
          maybe.classList.add("is-surrendered");
          yes.classList.add("is-glowing");
          maybe.setAttribute("aria-label", "Aceitar o convite");
        }
      }

      function tryDecline(event) {
        event.preventDefault();

        if (declineAttempts >= 4) {
          yes.click();
          return;
        }

        if (declineAttempts === 0) {
          notifyFirstDecline();
        }

        declineAttempts += 1;
        updateDeclineGame();
      }

      maybe.addEventListener("click", tryDecline);
    </script>
  </body>
</html>
